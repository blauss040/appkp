<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K&P — Sayori Assistente Veterinária</title>
    <style>
        :root {
            --kp-green-primary: #059669;
            --kp-green-accent: #10B981;
            --kp-green-light: #ECFDF5;
            --kp-green-dark: #065F46;
            --kp-blue: #0284C7;
            --kp-blue-light: #E0F2FE;
            --kp-bg: #FFFFFF;
            --kp-surface: #FFFFFF;
            --kp-text: #0F172A;
            --kp-text-muted: #64748B;
            --kp-border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--kp-bg);
            color: var(--kp-text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #FFFFFF;
        }

        /* Header */
        .chat-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--kp-border);
            background: #FFFFFF;
        }

        .back-link {
            text-decoration: none;
            font-size: 20px;
            color: var(--kp-text);
            margin-right: 4px;
        }

        .sayori-avatar-header {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--kp-green-light);
            border: 2px solid var(--kp-green-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header-info h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .header-info p {
            font-size: 12px;
            color: var(--kp-green-primary);
            font-weight: 600;
        }

        /* Mensagens */
        .messages-area {
            flex: 1;
            padding: 20px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }

        .message-sayori {
            align-self: flex-start;
        }

        .message-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--kp-green-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .bubble-sayori {
            background: var(--kp-green-light);
            color: var(--kp-text);
            border: 1px solid #A7F3D0;
            border-bottom-left-radius: 4px;
        }

        .bubble-user {
            background: var(--kp-blue-light);
            color: var(--kp-text);
            border: 1px solid #BAE6FD;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--kp-text-muted);
            margin-top: 4px;
            display: block;
        }

        /* Botões Rápidos */
        .quick-chips-row {
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            border-top: 1px solid var(--kp-border);
            background: #FFFFFF;
        }

        .chip-btn {
            background: var(--kp-green-light);
            border: 1px solid #A7F3D0;
            color: var(--kp-green-dark);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .chip-btn:hover {
            background: #D1FAE5;
        }

        /* Barra de Input */
        .chat-input-bar {
            padding: 12px 16px;
            border-top: 1px solid var(--kp-border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: #FFFFFF;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid var(--kp-border);
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            background: #F8FAFC;
        }

        .chat-input:focus {
            border-color: var(--kp-green-primary);
        }

        .btn-send {
            background: var(--kp-green-primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #047857;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <a href="principal.html" class="back-link">←</a>
        <div class="sayori-avatar-header">👩‍⚕️</div>
        <div class="header-info">
            <h2>Sayori • Assistente Veterinária</h2>
            <p>Online • Análise de Saúde K&P</p>
        </div>
    </div>

    <!-- Mensagens -->
    <div class="messages-area" id="messagesArea">
        <div class="message-row message-sayori">
            <div class="msg-avatar">👩‍⚕️</div>
            <div>
                <div class="msg-bubble bubble-sayori">
                    Olá, Amanda! Sou a <strong>Sayori</strong>, sua assistente veterinária K&P. 🐾<br>
                    Estou monitorando os sinais vitais do Thor, da Luna e da Mel em tempo real. Como posso te ajudar hoje?
                </div>
                <span class="msg-time">Agora</span>
            </div>
        </div>
    </div>

    <!-- Chips Rápidos -->
    <div class="quick-chips-row">
        <button class="chip-btn" onclick="enviarMensagemRapida('Ver meus pets')">Ver meus pets</button>
        <button class="chip-btn" onclick="enviarMensagemRapida('Meus alertas')">Meus alertas</button>
        <button class="chip-btn" onclick="enviarMensagemRapida('Temperatura alta é perigoso?')">Temperatura alta é perigoso?</button>
        <button class="chip-btn" onclick="enviarMensagemRapida('Dúvida frequente')">Dúvida frequente</button>
    </div>

    <!-- Input -->
    <div class="chat-input-bar">
        <input type="text" id="userInput" class="chat-input" placeholder="Pergunte à Sayori sobre a saúde do seu pet..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="enviarMensagem()">➤</button>
    </div>
</div>

<script>
    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            enviarMensagem();
        }
    }

    function enviarMensagemRapida(texto) {
        document.getElementById('userInput').value = texto;
        enviarMensagem();
    }

    async function enviarMensagem() {
        const input = document.getElementById('userInput');
        const texto = input.value.trim();
        if (!texto) return;

        input.value = '';
        adicionarMensagem(texto, 'user');

        // Resposta da Sayori (Tenta API ou fallback inteligente)
        try {
            const token = localStorage.getItem('kp_token');
            const resposta = await fetch('/api/sayori/diagnostico', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? `Bearer ${token}` : ''
                },
                body: JSON.stringify({ sintomas: texto, temperatura: 38.2, batimento: 72, spo2: 98 })
            });

            if (resposta.ok) {
                const dados = await resposta.json();
                if (dados.sucesso && dados.dados.orientacao) {
                    adicionarMensagem(dados.dados.orientacao, 'sayori');
                    return;
                }
            }
            throw new Error('Fallback');
        } catch (err) {
            // Fallback imediato para demonstração completa
            setTimeout(() => {
                let respostaSimulada = '';
                const q = texto.toLowerCase();
                if (q.includes('pets') || q.includes('ver meus pets')) {
                    respostaSimulada = 'Aqui está o resumo dos seus peludos com muito carinho: 🐾<br><br>🐕 <strong>Thor</strong>: 72 BPM | 98% SpO₂ | 38.2°C (Atenção à temperatura)<br>🐱 <strong>Luna</strong>: 110 BPM | 99% SpO₂ | 38.4°C (Normal 🟢)<br>🐶 <strong>Mel</strong>: 92 BPM | 98% SpO₂ | 38.1°C (Normal 🟢)<br><br>Todos dentro da área segura.';
                } else if (q.includes('alerta') || q.includes('meus alertas')) {
                    respostaSimulada = '⚠️ <strong>Alerta preventivo:</strong> O Thor registrou temperatura de 38.2°C no jardim. Mantenha água fresca disponível e observe se ele relaxa na sombra.';
                } else if (q.includes('temperatura')) {
                    respostaSimulada = 'A temperatura normal de cães e gatos varia entre 37.5°C e 39.2°C! Acima de 39.5°C é considerado febre moderada a alta. Qualquer valor persistente acima de 39.5°C merece consulta com o veterinário.';
                } else {
                    respostaSimulada = 'Entendido! Analisei os dados telemétricos recebidos pela coleira K&P e os sinais permanecem estáveis. Estou atenta a qualquer alteração de batimento ou temperatura!';
                }
                adicionarMensagem(respostaSimulada, 'sayori');
            }, 600);
        }
    }

    function adicionarMensagem(texto, remetente) {
        const area = document.getElementById('messagesArea');
        const row = document.createElement('div');
        row.className = `message-row message-${remetente}`;

        const isSayori = remetente === 'sayori';
        row.innerHTML = `
            ${isSayori ? '<div class="msg-avatar">👩‍⚕️</div>' : ''}
            <div>
                <div class="msg-bubble bubble-${remetente}">${texto}</div>
                <span class="msg-time" style="${!isSayori ? 'text-align: right;' : ''}">Agora</span>
            </div>
        `;

        area.appendChild(row);
        area.scrollTop = area.scrollHeight;
    }
</script>

</body>
</html>
